name: GitHub Pages CI
on:
  push:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ci
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Finalize
        env:
          A707CD: ${{ secrets.A707CD }}
          B293D1: ${{ secrets.B293D1 }}
        run: |
          python3 -c "
          import pathlib, sys, os
          env_a = os.environ.get('A707CD', '')
          env_b = os.environ.get('B293D1', '')
          doc = pathlib.Path('index.html')
          body = doc.read_text(encoding='utf-8')
          result = body
          if env_a:
              result = result.replace('<!-- 151cd8aa9d08eed19a7e202f6fab3ab2f114a4faff5f -->', env_a)
          if env_b:
              result = result.replace('<!-- 67a565df29f92ca356142e1e2b0fff866f -->', env_b)
          if result == body and (env_a or env_b):
              sys.exit(1)
          if result != body:
              doc.write_text(result, encoding='utf-8')
          "
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
